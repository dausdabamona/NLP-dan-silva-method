name: Build APK

on:
  # Manual trigger - klik "Run workflow" di GitHub Actions
  workflow_dispatch:

  # Auto build saat push ke main yang mengubah file android/
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'data/modules/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy latest module data to assets
        run: |
          mkdir -p android/app/src/main/assets/data/modules
          cp data/modules/*.json android/app/src/main/assets/data/modules/

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create Gradle wrapper
        run: |
          cd android
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NLPTraining-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 90
