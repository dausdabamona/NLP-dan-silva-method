plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nlptraining.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.nlptraining.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // URL server Flask Anda - GANTI dengan URL deploy Render/Railway Anda
        buildConfigField "String", "BASE_URL", "\"${project.findProperty('BASE_URL') ?: 'https://nlp-training.onrender.com'}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
