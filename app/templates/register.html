{% extends "base.html" %}
{% block title %}Daftar - NLP Training{% endblock %}
{% block header_title %}Daftar Akun{% endblock %}
{% block header_subtitle %}Buat akun baru untuk memulai{% endblock %}

{% block content %}
<div class="mt-3">
    <form method="POST" action="{{ url_for('auth.register') }}">
        <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-input" placeholder="Pilih username" required autofocus>
        </div>
        <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-input" placeholder="Minimal 4 karakter" required>
        </div>
        <div class="form-group">
            <label class="form-label">Konfirmasi Password</label>
            <input type="password" name="confirm_password" class="form-input" placeholder="Ulangi password" required>
        </div>
        <button type="submit" class="btn btn-primary">Daftar</button>
    </form>

    <div class="text-center mt-2">
        <p class="text-muted text-small">Sudah punya akun?</p>
        <a href="{{ url_for('auth.login') }}" class="btn btn-secondary mt-1">Masuk</a>
    </div>
</div>
{% endblock %}
