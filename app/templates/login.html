{% extends "base.html" %}
{% block title %}Masuk - NLP Training{% endblock %}
{% block header_title %}Selamat Datang{% endblock %}
{% block header_subtitle %}Masuk ke akun Anda{% endblock %}

{% block content %}
<div class="mt-3">
    <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-input" placeholder="Masukkan username" required autofocus>
        </div>
        <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-input" placeholder="Masukkan password" required>
        </div>
        <button type="submit" class="btn btn-primary">Masuk</button>
    </form>

    <div class="text-center mt-2">
        <p class="text-muted text-small">Belum punya akun?</p>
        <a href="{{ url_for('auth.register') }}" class="btn btn-secondary mt-1">Daftar Baru</a>
    </div>
</div>
{% endblock %}
